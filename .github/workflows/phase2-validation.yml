name: Phase 2 backend validation
on:
  push:
    branches: [poc/hitl-kill-integration, poc/llm01-asi01-asi02-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m compileall -q agent governance approval_api.py
      - run: pip install -r requirements.txt
      # Pytest suite is under tests/. The scripts/test_*.py files are
      # standalone integration probes with top-level execution, not pytest modules.
      - run: python -m pytest -q tests
      - run: python scripts/test_combined_agent_path.py
