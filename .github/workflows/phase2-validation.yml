name: Phase 2 backend validation
on:
  push:
    branches: [poc/hitl-kill-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m compileall -q agent governance approval_api.py
      - run: pip install -r requirements.txt
      - run: pytest -q
