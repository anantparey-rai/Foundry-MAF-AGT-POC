# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: foundry-maf-agt-poc
services:
    foundry-maf-agt-poc:
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_14
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        env:
            PYTHONNOUSERSITE: "1"
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        host: azure.ai.agent
        kind: hosted
        language: python
        name: foundry-maf-agt-poc
        project: .
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - poc-proj
    poc-proj:
        endpoint: https://foundrypoc2.services.ai.azure.com/api/projects/POC-proj
        host: azure.ai.project
